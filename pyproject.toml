[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "breakshell"
version = "1.0.0"
description = "BreakShell Agent - AI Agent Self-Model Safety Layer"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "torch>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["breakshell_pkg*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]