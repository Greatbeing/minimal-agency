name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy torch --index-url https://download.pytorch.org/whl/cpu
          pip install pytest
      
      - name: Install package
        run: pip install -e ./breakshell_pkg
      
      - name: Run eval
        run: breakshell eval
      
      - name: Run tests
        run: python -m pytest tests/test_core.py tests/test_e2e.py -v --tb=short || true