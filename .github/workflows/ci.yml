name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential
      
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install numpy --index-url https://download.pytorch.org/whl/cpu
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pytest pytest-cov
      
      - name: Install BreakShell package
        run: pip install -e ./breakshell_pkg
      
      - name: Run eval (core functionality)
        run: breakshell eval
      
      - name: Run tests
        run: python -m pytest tests/test_core.py tests/test_e2e.py -v --tb=short
        continue-on-error: true