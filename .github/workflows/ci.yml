name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy
      
      - name: Run test
        run: |
          python -c "import sys; sys.path.insert(0, '.'); from breakshell_pkg.breakshell.agent import BreakShell; import numpy as np; a = BreakShell(action_dim=3); act, info = a.act(); print('OK: action=', act)"
        continue-on-error: true